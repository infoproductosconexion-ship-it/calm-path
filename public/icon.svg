<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Calm Path">
  <!-- Fondo azul medianoche de la marca -->
  <rect width="512" height="512" rx="112" fill="#1A1536" />

  <!-- Contorno lineal de flor de loto de 8 pétalos (crema, solo líneas) -->
  <g
    transform="translate(256 256) scale(5.6) translate(-32 -32)"
    fill="none"
    stroke="#F6F0E3"
    stroke-width="2"
    stroke-linecap="round"
