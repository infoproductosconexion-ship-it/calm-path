  >
    <path d="M32 17.5 C37 14.5 38 9.5 32 3 C26 9.5 27 14.5 32 17.5 Z" />
    <path d="M32 17.5 C37 14.5 38 9.5 32 3 C26 9.5 27 14.5 32 17.5 Z" transform="rotate(45 32 32)" />
    <path d="M32 17.5 C37 14.5 38 9.5 32 3 C26 9.5 27 14.5 32 17.5 Z" transform="rotate(90 32 32)" />
    <path d="M32 17.5 C37 14.5 38 9.5 32 3 C26 9.5 27 14.5 32 17.5 Z" transform="rotate(135 32 32)" />
    <path d="M32 17.5 C37 14.5 38 9.5 32 3 C26 9.5 27 14.5 32 17.5 Z" transform="rotate(180 32 32)" />
    <path d="M32 17.5 C37 14.5 38 9.5 32 3 C26 9.5 27 14.5 32 17.5 Z" transform="rotate(225 32 32)" />
    <path d="M32 17.5 C37 14.5 38 9.5 32 3 C26 9.5 27 14.5 32 17.5 Z" transform="rotate(270 32 32)" />
    <path d="M32 17.5 C37 14.5 38 9.5 32 3 C26 9.5 27 14.5 32 17.5 Z" transform="rotate(315 32 32)" />
  </g>

  <!-- Luna creciente en crema y punto dorado en su interior -->
